{% extends "base.html" %}

{% block title %}
المقابلات - منصة التوظيف الذكية
{% endblock %}

{% block page_title %}المقابلات{% endblock %}

{% block content %}
<div class="w-full px-4 sm:px-6 lg:px-8 py-4 sm:py-8">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <div>
            <h2 class="text-xl sm:text-2xl font-bold text-gray-900 dark:text-white">قائمة المقابلات</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">إدارة وجدولة المقابلات مع المرشحين</p>
        </div>
        <a href="#" class="inline-flex items-center justify-center gap-2 px-3 sm:px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-lg transition-colors text-sm sm:text-base">
            <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            <span class="hidden sm:inline">مقابلة جديدة</span>
            <span class="sm:hidden">إضافة</span>
        </a>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-6">
        <div class="text-center py-12">
            <svg class="w-16 h-16 text-gray-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            <p class="text-gray-500 dark:text-gray-400 font-medium">لا توجد مقابلات حالياً</p>
            <p class="text-xs sm:text-sm text-gray-400 dark:text-gray-500 mt-1">ابدأ بإضافة مقابلة جديدة</p>
        </div>
    </div>
</div>
{% endblock %}
