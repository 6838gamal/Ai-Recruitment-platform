{% extends "base.html" %}
{% block page_title %}Edit Candidate{% endblock %}
{% block content %}
<div class="p-6">
  <h2 class="text-2xl font-bold">Edit Candidate</h2>
  <form method="post" action="{{ request.url_for('candidates:edit_submit', candidate_id=str(candidate.id)) }}" class="mt-4 space-y-4">
    <div>
      <label class="block text-sm font-medium">First name</label>
      <input name="first_name" value="{{ candidate.first_name or '' }}" required class="mt-1 block w-full rounded-md border px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium">Last name</label>
      <input name="last_name" value="{{ candidate.last_name or '' }}" class="mt-1 block w-full rounded-md border px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium">Email</label>
      <input name="email" type="email" value="{{ candidate.email or '' }}" required class="mt-1 block w-full rounded-md border px-3 py-2">
    </div>
    <div>
      <button type="submit" class="px-4 py-2 bg-primary-600 text-white rounded-md">Save</button>
      <a href="{{ request.url_for('candidates:list') }}" class="ml-2 text-sm text-gray-600">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
