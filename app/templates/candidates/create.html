{% extends "base.html" %}
{% block title %}Create Candidate — AI Recruitment Platform{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-6">
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow border border-gray-200 dark:border-gray-700 p-6">
    <h1 class="text-xl font-semibold text-gray-900 dark:text-white mb-4">Create Candidate</h1>

    <form method="post" action="{{ request.url_for('candidates:create') }}" class="space-y-4">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Full name</label>
        <input id="name" name="name" type="text" required class="mt-1 block w-full rounded-md border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-700 text-gray-900 dark:text-white px-3 py-2" />
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Email</label>
        <input id="email" name="email" type="email" required class="mt-1 block w-full rounded-md border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-700 text-gray-900 dark:text-white px-3 py-2" />
      </div>

      <div class="flex items-center gap-2">
        <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md">Create</button>
        <a href="{{ request.url_for('candidates:list') }}" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md text-gray-700 dark:text-gray-300">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
