<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — AI Recruitment Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
<div class="w-full max-w-md">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-gray-900">Set new password</h1>
        <p class="text-gray-600 mt-2 text-sm">Choose a strong password for your account</p>
    </div>
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
        {% if success %}
        <div class="text-center">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
            </div>
            <h2 class="font-semibold text-gray-900 mb-2">Password updated!</h2>
            <p class="text-gray-600 text-sm mb-6">You can now sign in with your new password.</p>
            <a href="/auth/login" class="inline-block px-6 py-2.5 bg-blue-600 text-white rounded-xl font-medium hover:bg-blue-700">Sign In</a>
        </div>
        {% else %}
        {% if error %}
        <div class="mb-5 rounded-xl bg-red-50 border border-red-200 p-4 text-sm text-red-700">{{ error }}</div>
        {% endif %}
        <form action="/auth/reset-password" method="post" class="space-y-5">
            <input type="hidden" name="token" value="{{ token }}">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">New Password</label>
                <input name="new_password" type="password" required minlength="8"
                       class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="Minimum 8 characters">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Confirm Password</label>
                <input name="confirm_password" type="password" required
                       class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="Repeat your password">
            </div>
            <button type="submit" class="w-full py-3 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700">
                Reset Password
            </button>
        </form>
        {% endif %}
    </div>
</div>
</body>
</html>
