{% extends "base.html" %}
{% block title %}404 — Page Not Found{% endblock %}
{% block content %}
<div class="flex items-center justify-center h-full">
  <div class="text-center px-6 py-16">
    <div class="text-8xl font-bold text-gray-200 dark:text-gray-700 mb-4">404</div>
    <h1 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">Page not found</h1>
    <p class="text-gray-500 dark:text-gray-400 mb-8">The page you're looking for doesn't exist or has been moved.</p>
    <a href="/dashboard" class="inline-flex items-center gap-2 px-5 py-2.5 bg-blue-600 text-white font-medium rounded-xl hover:bg-blue-700 transition-colors">
      Back to Dashboard
    </a>
  </div>
</div>
{% endblock %}
