{% extends "base.html" %}

{% block title %}إنشاء وظيفة جديدة — منصة التوظيف الذكية{% endblock %}
{% block page_title %}إنشاء وظيفة جديدة{% endblock %}

{% block content %}
<div class="p-6 max-w-3xl mx-auto">
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border p-6">
    <h2 class="text-2xl font-bold mb-4">إنشاء وظيفة جديدة</h2>

    {% if error %}
      <div class="mb-4 p-3 bg-red-50 text-red-700 rounded">{{ error }}</div>
    {% endif %}

    <form method="post" action="/jobs/create" class="space-y-4">
      <div>
        <label class="block text-sm font-medium">العنوان</label>
        <input name="title" required class="mt-1 w-full rounded-md border px-3 py-2" />
      </div>

      <div>
        <label class="block text-sm font-medium">الموقع</label>
        <input name="location" class="mt-1 w-full rounded-md border px-3 py-2" />
      </div>

      <div>
        <label class="block text-sm font-medium">الوصف</label>
        <textarea name="description" rows="8" class="mt-1 w-full rounded-md border px-3 py-2"></textarea>
      </div>

      <div class="flex items-center gap-3">
        <button type="submit" class="px-4 py-2 bg-primary-600 text-white rounded-md">إنشاء</button>
        <a href="/jobs" class="text-sm text-gray-600">إلغاء</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
