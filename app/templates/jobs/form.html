{% extends "base.html" %}

{% block content %}
  <div class="container mt-4">
    <h1>إنشاء وظيفة جديدة</h1>

    {% if error %}
      <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="/jobs/create">
      <div class="mb-3">
        <label for="title" class="form-label">المسمى الوظيفي</label>
        <input id="title" name="title" class="form-control" required />
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">الوصف</label>
        <textarea id="description" name="description" class="form-control" rows="6" required></textarea>
      </div>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label for="headcount" class="form-label">عدد الشواغر</label>
          <input id="headcount" name="headcount" type="number" min="1" class="form-control" value="1" />
        </div>
        <div class="col-md-4 mb-3">
          <label for="salary_min" class="form-label">الراتب الأدنى</label>
          <input id="salary_min" name="salary_min" type="number" step="0.01" class="form-control" />
        </div>
        <div class="col-md-4 mb-3">
          <label for="salary_max" class="form-label">الراتب الأقصى</label>
          <input id="salary_max" name="salary_max" type="number" step="0.01" class="form-control" />
        </div>
      </div>

      <div class="mb-3">
        <label for="employment_type" class="form-label">نوع التوظيف</label>
        <input id="employment_type" name="employment_type" class="form-control" />
      </div>

      <div class="mb-3">
        <label for="work_type" class="form-label">نمط العمل</label>
        <input id="work_type" name="work_type" class="form-control" />
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary">إنشاء</button>
        <a href="/jobs" class="btn btn-secondary ms-2">إلغاء</a>
      </div>
    </form>
  </div>
{% endblock %}
